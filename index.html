        <div class="original">
          <span>What lips my lips have kissed, and where, and why,</span>
          <span>I have forgotten, and what arms have lain</span>
          <span>Under my head till morning; but the rain</span>
          <span>Is full of ghosts to-night, that tap and sigh</span>
          <span>Upon the glass and listen for reply,</span>
          <span>And in my heart there stirs a quiet pain</span>
          <span>For unremembered lads that not again</span>
          <span>Will turn to me at midnight with a cry.</span>
          <span>Thus in the winter stands the lonely tree,</span>
          <span>Nor knows what birds have vanished one by one,</span>
          <span>Yet knows its boughs more silent than before:</span>
          <span>I cannot say what loves have come and gone,</span>
          <span>I only know that summer sang in me</span>
          <span>A little while, that in me sings no more.</span>
        </div>
      </stretch-text>
      <figcaption><span id="after" hidden>After </span><a rel="author" href="https://www.poetryfoundation.org/poems/46557/what-lips-my-lips-have-kissed-and-where-and-why">Edna St. Vincent Millay</a></figcaption>
